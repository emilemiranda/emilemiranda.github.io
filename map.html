<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Live Map — GIS Portfolio</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Leaflet CSS (required) -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />

        <!-- Your site CSS (load after Leaflet if you want to override map styles) -->
        <link rel="stylesheet" href="css/styles.css" />

        <!-- Optional: Font Awesome for icons (only if not already loaded by your site) -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            integrity=""
            crossorigin="anonymous"
        />

        <style>
            /* small page tweaks */
            body {
                background: #f8f9fa;
                padding-top: 72px;
            } /* fallback padding; map-init.js will adjust dynamically */
            #map {
                width: 100%;
                height: calc(100vh - 140px);
                min-height: 480px;
            }
            .map-legend {
                background: rgba(255, 255, 255, 0.9);
                padding: 8px;
                border-radius: 6px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            }
            .navbar-brand .name-first {
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <!-- NAVBAR (unchanged, uses your markup) -->
        <nav
            class="navbar navbar-expand-lg navbar-dark bg-secondary fixed-top"
            id="mainNav"
        >
            <div class="container">
                <a
                    class="navbar-brand d-flex align-items-center"
                    href="index.html"
                >
                    <span class="name-first">Emile</span>
                    <span class="name-middle">B
                        <span class="custom-icon" aria-hidden="true"><i class="far fa-compass"></i></span>
                    </span>
                    <span class="name-last">Miranda</span>
                </a>
                <button
                    class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarResponsive"
                    aria-controls="navbarResponsive"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <strong>Menu</strong> <i class="fas fa-bars"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item mx-0 mx-lg-1">
                            <a
                                class="nav-link py-3 px-0 px-lg-3 rounded"
                                href="index.html#portfolio"
                                >Portfolio</a
                            >
                        </li>
                        <li class="nav-item mx-0 mx-lg-1">
                            <a
                                class="nav-link py-3 px-0 px-lg-3 rounded fw-bold"
                                href="resume.html"
                                >Resume</a
                            >
                        </li>
                        <li class="nav-item mx-0 mx-lg-1">
                            <a
                                class="nav-link py-3 px-0 px-lg-3 rounded fw-bold active"
                                aria-current="page"
                                href="map.html"
                                >Live Map</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- HEADER -->
        <header
            class="masthead bg-primary text-white text-center"
            style="padding-top: 77px; padding-bottom: 37px"
        >
            <div class="container">
                <h1 class="masthead-heading text-uppercase mb-0">
                    Interactive Map
                </h1>
                <p class="masthead-subheading font-weight-light mb-0">
                    Pan, Zoom, and Click Features
                </p>
            </div>
        </header>

        <!-- MAP -->
        <main class="container-fluid p-0">
            <div
                id="map"
                role="application"
                aria-label="Interactive web map"
            ></div>

            <div
                style="
                    position: absolute;
                    top: 120px;
                    right: 12px;
                    z-index: 660;
                "
            >
                <!-- <div class="map-legend">
                    <strong>Map controls</strong><br />
                    • Click features for details<br />
                    • Use zoom buttons or scroll
                </div> -->
            </div>
        </main>

        <!-- FOOTER (kept concise) -->
        <footer class="footer bg-secondary text-white text-center py-4">
            <div class="container">
                <div class="row">
                    <div class="col-lg-4 mb-3">
                        <h4 class="text-uppercase">LinkedIn</h4>
                        <p class="mb-0">
                            <a
                                class="text-decoration-none text-white fw-bold"
                                href="https://www.linkedin.com/in/emilemiranda/"
                                target="_blank"
                                >linkedin.com/in/emilemiranda/</a
                            >
                        </p>
                    </div>
                    <div class="col-lg-4 mb-3">
                        <h4 class="text-uppercase">Around the Web</h4>
                        <a
                            class="btn btn-outline-light btn-social mx-1"
                            href="https://emilemiranda.github.io"
                            target="_blank"
                            ><i class="fas fa-fw fa-globe"></i
                        ></a>
                    </div>
                    <div class="col-lg-4">
                        <h4 class="text-uppercase">Get In touch</h4>
                        <p class="mb-0">
                            <a
                                href="mailto:emile.mirandabalas@gmail.com"
                                class="text-decoration-none text-white fw-bold"
                                >emile.mirandabalas@gmail.com</a
                            >
                        </p>
                    </div>
                </div>
            </div>
        </footer>

        <!-- SCRIPTS: order matters -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <!-- Your existing site script -->
        <script src="js/scripts.js"></script>

        <!-- Map initializer (the file we created) -->
        <script src="js/map-init.js"></script>
    </body>
</html>
